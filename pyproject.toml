[project]
name = "tg-game-pivovar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.29.0",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "google-genai>=2.8.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "sqlalchemy>=2.0.50",
    "redis>=5.0.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.17",
]

[tool.pyright]
extraPaths = [".", "scripts"]


[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"

